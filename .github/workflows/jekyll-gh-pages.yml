name: Deploy site to Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment for the "pages" group
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # === 1. INSTALLS "requirements.txt" (from Turn 41) ===
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Based on your requirements.txt
          cache: 'pip'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      
      # === THIS IS THE FIX: INSTALL R AND CAUSALIMPACT ===
      - name: Setup R
        uses: r-lib/actions/setup-R@v2
        with:
          r-version: 'release'
      - name: Install R CausalImpact package
        run: Rscript -e 'install.packages("CausalImpact")'
      # === END OF FIX ===

      # === 2. RUNS THE 4-SCRIPT PIPELINE (from Turn 49) ===
      - name: Run Causal Analysis Pipeline
        run: |
          python scripts/clean_all.py
          python src/run_analysis.py
          python scripts/regenerate_figures.py
          python scripts/build_html_report.py
      
      # === 3. PREPARES THE GENERATED REPORT (from Turn 27) ===
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare site content
        shell: bash
        run: |
          set -euo pipefail
          # Make report the site index if it exists
          if [ -f "reports/report.html" ]; then
            cp -f reports/report.html./index.html
            echo "Set reports/report.html as index.html"
          else
            echo "ERROR: reports/report.html not found after analysis!"
            exit 1
          fi
          # Optionally include the ATT figure
          if [ -f "figures/att_summary.png" ]; then
            mkdir -p assets
            cp -f figures/att_summary.png assets/
            echo "Copied ATT figure to assets/"
          fi

      # === 4. BUILDS AND UPLOADS THE SITE ===
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source:./
          destination:./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # === 5. DEPLOYS THE SITE ===
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
