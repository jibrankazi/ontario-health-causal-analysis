name: CI - Causal Analysis

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pandas numpy statsmodels scikit-learn pyyaml matplotlib

      - name: Run analysis
        run: |
          python scripts/clean_all.py
          python src/run_analysis.py
          python scripts/regenerate_figures.py
          python scripts/build_html_report.py

      - name: Validate results
        run: |
          python -c "
          import json, math
          from pathlib import Path
          data = json.load(open('results/results.json'))
          atts = [data['did']['att'], data['psm']['att']]
          if any(a is None or not math.isfinite(a) for a in atts):
              exit('Invalid ATT values!')
          print('All good! DiD:', data['did']['att'], 'PSM:', data['psm']['att'])
          "

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: report-and-results
          path: |
            reports/report.html
            figures/
            results/results.json
